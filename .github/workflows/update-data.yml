name: Refresh data catalogs

on:
  schedule:
    # Weekly Mondays at 06:00 UTC. Adjust freely.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch umapyoi.net catalog (character + support metadata)
        run: npm run fetch:umapyoi

      - name: Fetch UmaTools game-extracted dumps (stats, skills, races)
        run: npm run fetch:umatools

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/generated; then
            echo "No data changes."
            exit 0
          fi
          git add src/data/generated
          git commit -m "chore(data): weekly catalog refresh (umapyoi + UmaTools)"
          git push
